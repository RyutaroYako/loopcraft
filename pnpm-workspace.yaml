packages:
  - apps/*
  - packages/*

catalogMode: prefer

# 依存は最新版を exact で入れる
savePrefix: ""

catalog:
  "@resvg/resvg-js": 2.6.2
  "@types/node": 26.6.6
  # vitest と @vitest/* を最新にせず vite-plus が同梱する版に揃えるのは、ずれるとカバレッジの実行が止まるため
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@vizejs/vite-plugin": 0.655.0
  lightningcss: 1.33.0
  modern-screenshot: 4.7.0
  reka-ui: 2.11.0
  typescript: 7.1.0-beta
  valibot: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  vize: 0.655.0
  vue: 3.5.44

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAgeExclude:
  - "@vizejs/native-darwin-arm64@0.655.0"
  - "@vizejs/native-darwin-x64@0.655.0"
  - "@vizejs/native-linux-arm64-gnu@0.655.0"
  - "@vizejs/native-linux-arm64-musl@0.655.0"
  - "@vizejs/native-linux-x64-gnu@0.655.0"
  - "@vizejs/native-linux-x64-musl@0.655.0"
  - "@vizejs/native-win32-arm64-msvc@0.655.0"
  - "@vizejs/native-win32-x64-msvc@0.655.0"
  - "@vizejs/native@0.655.0"
  - "@vizejs/unplugin@0.655.0"
  - "@vizejs/vite-plugin@0.655.0"
  - vize@0.655.0
