name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        # 公開するジョブには、ほかの実行が書いたキャッシュを持ち込まない
        with:
          node-version: "24"
          cache: false
      - name: Check the tag
        run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が apps/cli/package.json の版 $version と一致しません"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::タグ $GITHUB_REF_NAME のコミットが main にありません"
            exit 1
          fi
      - run: vp check
      - run: vp exec --filter @loopcraft/web playwright install --with-deps chromium
      - run: vp test run --coverage
      - name: Publish to npm
        working-directory: apps/cli
        # catalog: と workspace: を解決するため、npm ではなく pnpm で公開する。認証は OIDC
        run: vp pm publish --no-git-checks --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
