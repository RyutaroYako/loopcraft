name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# 途中で取り消さないのは、公開の途中で止めると、古い版と新しい版が混ざった状態が残ることがあるため
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 依存関係のインストールとビルドは、公開の権限を持たないジョブで行う
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        # 公開するものを作るジョブには、ほかの実行が書いたキャッシュを持ち込まない
        with:
          node-version: "24"
          cache: false
      - run: vp run @loopcraft/web#build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
