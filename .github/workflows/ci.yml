name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true
      # Vite Task のキャッシュは実行間で引き継がない。まだ実験的な機能で、どのタスクも数秒で終わり復元の手間に見合わないため
      - run: vp check
      # Vize で別に確かめるのは、vp check の型チェックが .vue の中を見ず、テンプレートの lint も持たないため
      - run: vp run @loopcraft/web#check:vue
      - run: vp run @loopcraft/web#lint:vue
      - run: vp exec --filter @loopcraft/web playwright install --with-deps chromium
      - name: Test with coverage
        id: test
        run: vp test run --coverage
      - name: Coverage report
        if: always() && steps.test.outcome != 'skipped' && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
      - run: vp run -r build
      - name: Smoke test the packed CLI
        run: |
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP")
          scripts/smoke-test.sh "$RUNNER_TEMP"/loopcraft-*.tgz
