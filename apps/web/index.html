<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17212b" media="(prefers-color-scheme: dark)" />
    <title>Loopcraft</title>
    <!-- theme.ts に任せず CSS より前で決めるのは、モジュールの実行を待つと最初の一瞬だけ違うテーマで描かれるため -->
    <script>
      {
        let choice = null;
        try {
          choice = localStorage.getItem("loopcraft:theme");
        } catch {}
        const dark =
          choice === "dark" ||
          (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
